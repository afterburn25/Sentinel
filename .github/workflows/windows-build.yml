# Sentinel release: 1.0.0
name: Windows Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sentinel-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC x64 / Release
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      VCPKG_ROOT: C:\vcpkg
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-release

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc-release --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset windows-msvc-release

      - name: Verify no SQLite DLL dependency
        shell: pwsh
        run: |
          $exe = "out/build/windows-msvc-release/Release/SentinelCli.exe"
          if (-not (Test-Path $exe)) { throw "SentinelCli.exe missing before dependency check" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }

          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "Visual Studio installation not found" }

          $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devCmd)) { throw "VsDevCmd.bat not found" }

          $outputFile = Join-Path $env:RUNNER_TEMP "sentinel-dependencies.txt"
          $cmd = '"' + $devCmd + '" -arch=x64 -host_arch=x64 >nul && dumpbin /dependents "' + $exe + '" > "' + $outputFile + '"'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "dumpbin dependency inspection failed" }

          $deps = Get-Content $outputFile -Raw
          $deps | Write-Host
          if ($deps -match '(?i)sqlite3\.dll') {
            throw "SentinelCli.exe still depends on sqlite3.dll"
          }

      - name: Install package
        shell: pwsh
        run: >-
          cmake --install out/build/windows-msvc-release
          --config Release
          --prefix package/Sentinel-1.0.0-windows-x64

      - name: Azure login for Artifact Signing
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ACCOUNT != '' && env.ARTIFACT_SIGNING_PROFILE != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Sentinel executables with Microsoft Artifact Signing
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ACCOUNT != '' && env.ARTIFACT_SIGNING_PROFILE != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\package\Sentinel-1.0.0-windows-x64
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Sentinel Secure Evidence & Integrity
          description-url: https://github.com/afterburn25/Sentinel

      - name: Verify Authenticode signatures
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ACCOUNT != '' && env.ARTIFACT_SIGNING_PROFILE != '' }}
        shell: pwsh
        run: |
          $root = Resolve-Path package/Sentinel-1.0.0-windows-x64
          $executables = Get-ChildItem $root -Filter *.exe -File -Recurse
          if (-not $executables) { throw "No executables found for signature verification" }

          foreach ($exe in $executables) {
            $signature = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): $($signature.Status) - $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") {
              throw "Invalid or missing Authenticode signature: $($exe.FullName)"
            }
          }

      - name: Record unsigned development-build status
        if: ${{ env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == '' || env.ARTIFACT_SIGNING_ENDPOINT == '' || env.ARTIFACT_SIGNING_ACCOUNT == '' || env.ARTIFACT_SIGNING_PROFILE == '' }}
        shell: pwsh
        run: |
          @"
          SENTINEL DEVELOPMENT BUILD - NOT AUTHENTICODE SIGNED

          This build was produced without a configured trusted code-signing identity.
          Windows SmartScreen may show "Windows protected your PC" for unsigned or low-reputation builds.

          Production releases should be signed using Microsoft Artifact Signing.
          Repository: https://github.com/afterburn25/Sentinel
          Commit: ${{ github.sha }}
          "@ | Set-Content -Encoding utf8 package/Sentinel-1.0.0-windows-x64/SIGNING-STATUS.txt

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $root = Resolve-Path package/Sentinel-1.0.0-windows-x64
          $files = Get-ChildItem $root -File -Recurse | Sort-Object FullName
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\\','/')
            "$hash  $relative"
          }
          $lines | Set-Content -Encoding ascii "$root/SHA256SUMS.txt"

      - name: Verify packaged launcher layout
        shell: pwsh
        run: |
          $root = "package/Sentinel-1.0.0-windows-x64"
          if (-not (Test-Path "$root/Sentinel.exe")) { throw "Sentinel.exe GUI missing" }
          if (-not (Test-Path "$root/bin/SentinelCli.exe")) { throw "SentinelCli.exe missing" }
          if (-not (Test-Path "$root/migrations")) { throw "migrations folder missing" }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-1.0.0-windows-x64
          path: package/Sentinel-1.0.0-windows-x64/
          if-no-files-found: error
          retention-days: 30
